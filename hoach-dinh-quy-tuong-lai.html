<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const CURRENT_YEAR = 2026;
const FUND_COLORS = ["#A9762E","#2F6F62","#7A5FB0","#B5432F","#3E6FA0","#8C6A3F"];
const STORAGE_KEY = "qgd_funds_v2";

function fmt(n){
  if(!isFinite(n)) return "—";
  const sign = n<0?"-":"";
  return sign + Math.round(Math.abs(n)).toLocaleString("vi-VN") + " đ";
}
function fmtShort(n){
  if(!isFinite(n)) return "—";
  const abs=Math.abs(n), sign=n<0?"-":"";
  if(abs>=1e9) return sign+(abs/1e9).toFixed(2).replace(/\.00$/,"")+" tỷ";
  if(abs>=1e6) return sign+(abs/1e6).toFixed(0)+" tr";
  return fmt(n);
}
function formatNumber(n){
  if(n===""||n===null||n===undefined||isNaN(n)) return "";
  return Number(n).toLocaleString("vi-VN");
}
function parseNumber(str){
  const digits = String(str).replace(/[^\d-]/g,"");
  if(digits===""||digits==="-") return 0;
  return parseInt(digits,10);
}

// Trả về map { year: bội số (2,4,8...) } — năm nào số dư lần đầu đạt mốc gấp đôi
// so với số dư năm 1 (hoặc gấp đôi mốc trước đó) thì được đánh dấu.
function computeDoublingMilestones(annualRows, getNav, getYear){
  const map = {};
  if(!annualRows || !annualRows.length) return map;
  const baseline = getNav(annualRows[0]);
  if(!(baseline>0)) return map;
  let mult = 2;
  annualRows.forEach(row=>{
    const nav = getNav(row);
    while(nav >= baseline*mult){
      map[getYear(row)] = mult;
      mult *= 2;
    }
  });
  return map;
}

function pvAnnuity(amountPerYear, years, ratePct){
  const r = ratePct/100;
  if(years<=0) return 0;
  if(r===0) return amountPerYear*years;
  return amountPerYear*(1-Math.pow(1+r,-years))/r;
}

// ---- Mode "sequential": accumulate for accYears, THEN withdraw for withdrawYears afterward ----
function computeSequential(fund){
  const ratePct = Number(fund.rate)||0;
  const rMonth = Math.pow(1+ratePct/100, 1/12)-1;
  const accYears = Math.max(0, Number(fund.accYears)||0);
  const nMonths = Math.round(accYears*12);
  const withdrawYears = Math.max(0, Number(fund.withdrawYears)||0);
  const withdrawAmount = Number(fund.withdrawAmount)||0;
  const lumpSum = Number(fund.lumpSum)||0;

  const targetAmount = fund.goalMode==="direct"
    ? (Number(fund.targetAmountInput)||0)
    : pvAnnuity(withdrawAmount, withdrawYears, ratePct);

  const fvLump = lumpSum*Math.pow(1+rMonth,nMonths);
  const remaining = targetAmount - fvLump;

  let monthlyRequired = 0;
  if(remaining>0 && nMonths>0){
    const denom = Math.pow(1+rMonth,nMonths)-1;
    monthlyRequired = denom>0 ? (remaining*rMonth)/denom : remaining/nMonths;
  }

  let nav = lumpSum;
  const monthlyNav=[nav];
  for(let m=1;m<=nMonths;m++){
    nav = nav*(1+rMonth)+monthlyRequired;
    monthlyNav.push(nav);
  }

  const annualRows=[];
  for(let y=1;y<=accYears;y++){
    const startNav = monthlyNav[(y-1)*12] ?? monthlyNav[monthlyNav.length-1];
    const endNav = monthlyNav[y*12] ?? monthlyNav[monthlyNav.length-1];
    const contribution = (y===1?lumpSum:0)+monthlyRequired*12;
    const interest = endNav-startNav-contribution;
    annualRows.push({year:y,calYear:CURRENT_YEAR+y-1,phase:"Tích lũy",contribution,withdrawal:0,interest,navEnd:endNav});
  }
  let navW = monthlyNav[nMonths] ?? lumpSum;
  for(let y=1;y<=withdrawYears;y++){
    const startNav=navW;
    const grown=startNav*(1+ratePct/100);
    const endNav=grown-withdrawAmount;
    annualRows.push({year:accYears+y,calYear:CURRENT_YEAR+accYears+y-1,phase:"Rút",contribution:0,withdrawal:withdrawAmount,interest:grown-startNav,navEnd:endNav});
    navW=endNav;
  }
  return {targetAmount,monthlyRequired,annualRows,finalNav:navW,totalYears:accYears+withdrawYears,hasDeficit:false};
}

// ---- Mode "simultaneous": contribute AND withdraw at the same time, from year 1 ----
// contribution runs years [1..accYears], withdrawal runs years [1..withdrawYears] (both start now, can overlap or one can outlast the other)
function simulateSimultaneous(fund, monthlyContribution){
  const ratePct = Number(fund.rate)||0;
  const rMonth = Math.pow(1+ratePct/100, 1/12)-1;
  const lumpSum = Number(fund.lumpSum)||0;
  const contribYears = Math.max(0, Number(fund.accYears)||0);
  const drawYears = Math.max(0, Number(fund.withdrawYears)||0);
  const withdrawAmount = Number(fund.withdrawAmount)||0;
  const totalYears = Math.max(contribYears, drawYears);

  let nav = lumpSum;
  const annualRows=[];
  for(let y=1;y<=totalYears;y++){
    const inContrib = y<=contribYears;
    const inDraw = y<=drawYears;
    const yearStartNav = nav;
    let yearContribution = 0;
    for(let m=1;m<=12;m++){
      nav = nav*(1+rMonth);
      if(inContrib){ nav += monthlyContribution; yearContribution += monthlyContribution; }
    }
    let yearWithdrawal = 0;
    if(inDraw){ nav -= withdrawAmount; yearWithdrawal = withdrawAmount; }
    if(y===1) yearContribution += lumpSum;
    const navBeforeWithdrawal = nav + yearWithdrawal;
    const interest = navBeforeWithdrawal - yearStartNav - yearContribution;
    const phase = inContrib && inDraw ? "Góp & Rút" : inDraw ? "Rút" : "Tích lũy";
    annualRows.push({year:y, calYear:CURRENT_YEAR+y-1, phase, contribution:yearContribution, withdrawal:yearWithdrawal, interest, navEnd:nav});
  }
  return {annualRows, finalNav: nav, totalYears};
}

function computeSimultaneous(fund){
  const base = simulateSimultaneous(fund, 0).finalNav;
  const withUnit = simulateSimultaneous(fund, 1).finalNav;
  const K = withUnit - base;
  let monthlyRequired = K > 0 ? Math.max(0, -base / K) : 0;
  const sim = simulateSimultaneous(fund, monthlyRequired);
  const hasDeficit = sim.annualRows.some(r => r.navEnd < -1);
  return {targetAmount: null, monthlyRequired, annualRows: sim.annualRows, finalNav: sim.finalNav, totalYears: sim.totalYears, hasDeficit};
}

function computeFund(fund){
  return fund.type === "simultaneous" ? computeSimultaneous(fund) : computeSequential(fund);
}

// ---- seed funds based on the user's spreadsheet + clarified scenarios ----
const seedFunds = [
  {id:"f1",name:"Quỹ Bố Mẹ",type:"simultaneous",rate:10,accYears:20,lumpSum:0,goalMode:"direct",targetAmountInput:2000000000,withdrawAmount:200000000,withdrawYears:35},
  {id:"f2",name:"Quỹ con gái đi du học",type:"sequential",rate:12,accYears:5,lumpSum:0,goalMode:"direct",targetAmountInput:2500000000,withdrawAmount:500000000,withdrawYears:5},
  {id:"f3",name:"Quỹ con trai đi du học",type:"sequential",rate:12,accYears:10,lumpSum:0,goalMode:"direct",targetAmountInput:3000000000,withdrawAmount:500000000,withdrawYears:5},
  {id:"f4",name:"Quỹ Du Lịch",type:"simultaneous",rate:10,accYears:10,lumpSum:0,goalMode:"direct",targetAmountInput:1000000000,withdrawAmount:250000000,withdrawYears:20},
];

function loadFunds(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) return parsed.map(f=>({type:"sequential",...f}));
    }
  }catch(e){}
  return seedFunds;
}

const CAP_STORAGE_KEY = "qgd_cap_v1";
function loadCap(){
  try{
    const raw = localStorage.getItem(CAP_STORAGE_KEY);
    if(raw!==null){ const n = JSON.parse(raw); if(typeof n==="number" && isFinite(n)) return n; }
  }catch(e){}
  return 0;
}

let idCounter = 100;

function Field({label,hint,children,full}){
  return (
    <div className={"field"+(full?" full":"")}>
      <span className="field-label">{label}</span>
      {children}
      {hint && <span className="field-hint">{hint}</span>}
    </div>
  );
}

function MoneyInput({value,onChange,suffix}){
  const [text,setText] = useState(formatNumber(value));
  useEffect(()=>{ setText(formatNumber(value)); },[value]);
  return (
    <div className="input-wrap">
      <input className="input mono" inputMode="numeric" value={text}
        onChange={(e)=>{ const p=parseNumber(e.target.value); setText(formatNumber(p)); onChange(p); }} />
      {suffix && <span className="input-suffix">{suffix}</span>}
    </div>
  );
}

function PlainNumberInput({value,onChange,suffix,step}){
  return (
    <div className="input-wrap">
      <input className="input mono" type="number" step={step||"1"} value={value}
        onChange={(e)=>onChange(e.target.value===""?0:Number(e.target.value))} />
      {suffix && <span className="input-suffix">{suffix}</span>}
    </div>
  );
}

function Segmented({value,options,onChange}){
  return (
    <div className="segmented">
      {options.map(o=>(
        <button key={o.value} className={value===o.value?"active":""} onClick={()=>onChange(o.value)}>{o.label}</button>
      ))}
    </div>
  );
}

function FundCard({fund,index,onChange,onRemove,result}){
  const color = FUND_COLORS[index%FUND_COLORS.length];
  const set = (patch)=>onChange({...fund,...patch});
  const isSimul = fund.type === "simultaneous";

  return (
    <div className="fund-card">
      <div className="fund-card-head">
        <span className="dot" style={{background:color}}></span>
        <input className="name-input" value={fund.name} onChange={(e)=>set({name:e.target.value})} />
        <button className="btn-remove" onClick={onRemove}>Xóa quỹ</button>
      </div>
      <div className="fund-body">
        <Field label="Kiểu quỹ" full>
          <Segmented value={fund.type||"sequential"} onChange={(v)=>set({type:v})}
            options={[{value:"sequential",label:"Tích lũy trước, rút sau"},{value:"simultaneous",label:"Vừa góp vừa rút song song"}]} />
        </Field>

        <Field label="Lãi suất kỳ vọng / năm">
          <PlainNumberInput value={fund.rate} onChange={(v)=>set({rate:v})} suffix="%/năm" step="0.1" />
        </Field>
        <Field label={isSimul ? "Số năm vừa góp vừa rút" : "Số năm tích lũy"}>
          <PlainNumberInput value={fund.accYears} onChange={(v)=>set({accYears:v})} suffix="năm" />
        </Field>

        {!isSimul && (
          <Field label="Cách xác định số tiền cần" full>
            <Segmented value={fund.goalMode} onChange={(v)=>set({goalMode:v})}
              options={[{value:"direct",label:"Nhập thẳng số tiền"},{value:"fromWithdrawal",label:"Tính từ nhu cầu rút"}]} />
          </Field>
        )}

        {!isSimul && fund.goalMode==="direct" && (
          <Field label="Số tiền mục tiêu cần có" full hint="Ví dụ: 2.000.000.000">
            <MoneyInput value={fund.targetAmountInput} onChange={(v)=>set({targetAmountInput:v})} suffix="đ" />
          </Field>
        )}
        {!isSimul && fund.goalMode!=="direct" && (
          <div className="info-box">Số tiền mục tiêu sẽ tự tính từ nhu cầu rút bên dưới.</div>
        )}
        {isSimul && (
          <div className="info-box">Quỹ này vừa góp vừa rút ngay từ năm nay — không cần đặt mục tiêu, hệ thống tự tính số tiền cần góp mỗi tháng để rút đều đặn.</div>
        )}

        <Field label="Bỏ sẵn 1 lần ngay bây giờ" full hint="Phần còn thiếu sẽ tự tính ra góp hàng tháng">
          <MoneyInput value={fund.lumpSum} onChange={(v)=>set({lumpSum:v})} suffix="đ" />
        </Field>

        <Field label="Muốn rút mỗi năm">
          <MoneyInput value={fund.withdrawAmount} onChange={(v)=>set({withdrawAmount:v})} suffix="đ/năm" />
        </Field>
        <Field label={isSimul ? "Tổng số năm rút (từ năm nay)" : "Rút trong bao nhiêu năm"} hint={isSimul ? "Quỹ sẽ cạn dần đến 0 vào cuối năm này" : "Để 0 nếu không rút dần"}>
          <PlainNumberInput value={fund.withdrawYears} onChange={(v)=>set({withdrawYears:v})} suffix="năm" />
        </Field>

        {result.hasDeficit && (
          <div className="warn-box">⚠ Quỹ có thể bị âm tạm thời ở vài năm đầu (rút nhanh hơn tốc độ góp). Cân nhắc bỏ thêm 1 khoản ban đầu để tránh thiếu hụt.</div>
        )}
      </div>
      <div className="fund-result">
        <div className="result-grid">
          {!isSimul ? (
            <div>

            </div>
          )}
          <div>
            <div className="result-label">Cần góp mỗi tháng</div>
            <div className="result-value mono" style={{color,fontWeight:700}}>{fmt(result.monthlyRequired)}</div>
          </div>
        </div>
        <div className="result-note">
          {isSimul ? (
            <>
              {fund.lumpSum>0 && <>Bỏ sẵn {fmtShort(fund.lumpSum)} ngay, rồi </>}
              góp <b>{fmtShort(result.monthlyRequired)}</b>/tháng trong {fund.accYears} năm, <b>đồng thời</b> rút đều {fmtShort(fund.withdrawAmount)}/năm ngay từ năm nay.
              Sau năm {fund.accYears} thì ngừng góp, quỹ tiếp tục tự rút đến khi cạn ở năm {result.totalYears} (năm {CURRENT_YEAR+result.totalYears-1}).
            </>
          ) : (
            <>
              {fund.lumpSum>0 && <>Bỏ sẵn {fmtShort(fund.lumpSum)} ngay, rồi </>}
              Góp <b>{fmtShort(result.monthlyRequired)}</b>/tháng trong {fund.accYears} năm → đạt {fmtShort(result.targetAmount)}.
              {fund.withdrawYears>0 && <> Sau đó rút {fmtShort(fund.withdrawAmount)}/năm trong {fund.withdrawYears} năm.</>}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function CashFlowChart({funds,results}){
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const chartData = useMemo(()=>{
    const maxYears = Math.max(1, ...funds.map(f=>results[f.id].totalYears));
    let cumulativeInvested = 0;
    const data=[];
    for(let y=1;y<=maxYears;y++){
      let contribution=0, withdrawal=0, navEnd=0;
      funds.forEach(f=>{
        const result = results[f.id];
        const row = result.annualRows.find(r=>r.year===y);
        if(row){ contribution+=row.contribution; withdrawal+=row.withdrawal; navEnd+=row.navEnd; }
        else{ navEnd+=result.finalNav; }
      });
      cumulativeInvested += contribution;
      data.push({calYear:CURRENT_YEAR+y-1, contribution, withdrawal, navEnd, cumulativeInvested});
    }
    return data;
  },[funds,results]);

  useEffect(()=>{
    if(!canvasRef.current) return;
    if(chartRef.current) chartRef.current.destroy();
    const ctx = canvasRef.current.getContext("2d");
    chartRef.current = new Chart(ctx,{
      type:"bar",
      data:{
        labels: chartData.map(r=>r.calYear),
        datasets:[
          {type:"bar", label:"Góp vào trong năm", data:chartData.map(r=>r.contribution), backgroundColor:"#2F6F62CC", borderRadius:3, order:2},
          {type:"bar", label:"Rút ra trong năm", data:chartData.map(r=>-r.withdrawal), backgroundColor:"#B5432FCC", borderRadius:3, order:2},
          {type:"line", label:"Tổng vốn đã góp (lũy kế)", data:chartData.map(r=>r.cumulativeInvested), borderColor:"#A9762E", borderDash:[5,3], borderWidth:2, pointRadius:0, tension:0.25, fill:false, order:1},
          {type:"line", label:"Tiền còn lại cuối năm", data:chartData.map(r=>r.navEnd), borderColor:"#20293A", borderWidth:2.5, pointRadius:0, tension:0.25, fill:false, order:0},
        ],
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        interaction:{mode:"index",intersect:false},
        scales:{
          y:{ticks:{callback:(v)=>fmtShort(v)}, grid:{color:"#E3D9C0"}},
          x:{grid:{display:false}},
        },
        plugins:{
          legend:{position:"bottom", labels:{boxWidth:10, font:{size:11}}},
          tooltip:{callbacks:{label:(c)=>c.dataset.label+": "+fmt(Math.abs(c.parsed.y))}},
        },
      },
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[chartData]);

  return (
    <div className="panel" style={{marginBottom:20}}>
      <div className="chart-note">Dòng tiền tổng hợp mọi quỹ theo năm — cột xanh là tiền góp vào, cột đỏ là tiền rút ra (chúc xuống cho dễ thấy); đường nét đứt vàng là tổng vốn đã góp lũy kế, đường liền màu đen là số tiền còn lại thực tế cuối mỗi năm.</div>
      <div className="chart-wrap"><canvas ref={canvasRef}></canvas></div>
    </div>
  );
}

function YearlySummaryTable({funds,results}){
  const maxYears = Math.max(1, ...funds.map(f=>results[f.id].totalYears));

  const rows = useMemo(()=>{
    const list=[];
    let cumContribution = 0;
    for(let y=1;y<=maxYears;y++){
      const calYear = CURRENT_YEAR+y-1;
      const perFund = funds.map(f=>{
        const result = results[f.id];
        const row = result.annualRows.find(r=>r.year===y);
        if(row){
          const monthly = row.phase!=="Rút" ? result.monthlyRequired : 0;
          return {contribution:row.contribution, interest:row.interest, withdrawal:row.withdrawal, navEnd:row.navEnd, monthly};
        }
        // quỹ đã kết thúc vòng đời trước năm này — số dư giữ nguyên ở mức cuối cùng
        return {contribution:0, interest:0, withdrawal:0, navEnd:result.finalNav, monthly:0};
      });
      const totals = perFund.reduce((acc,p)=>({
        contribution:acc.contribution+p.contribution,
        interest:acc.interest+p.interest,
        withdrawal:acc.withdrawal+p.withdrawal,
        navEnd:acc.navEnd+p.navEnd,
        monthly:acc.monthly+p.monthly,
      }),{contribution:0,interest:0,withdrawal:0,navEnd:0,monthly:0});
      cumContribution += totals.contribution;
      totals.cumContribution = cumContribution;
      list.push({calYear,y,perFund,totals});

function exportExcel(funds, results){
  const wb = XLSX.utils.book_new();
  const summary = funds.map(f=>({
    "Tên quỹ": f.name,
    "Kiểu quỹ": f.type==="simultaneous" ? "Vừa góp vừa rút" : "Tích lũy trước, rút sau",
    "Lãi suất/năm (%)": f.rate,
    "Số năm góp/tích lũy": f.accYears,
    "Bỏ sẵn 1 lần (đ)": f.lumpSum,
    "Cần góp/tháng (đ)": Math.round(results[f.id].monthlyRequired),
    "Rút mỗi năm (đ)": f.withdrawAmount,
    "Số năm rút": f.withdrawYears,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), "Tổng quan");

  const maxYears = Math.max(1, ...funds.map(f=>results[f.id].totalYears));
  const yearlyRows=[];
  for(let y=1;y<=maxYears;y++){
    const calYear = CURRENT_YEAR+y-1;
    const rowOut = {"Năm": calYear};
    let totC=0, totI=0, totW=0, totM=0, totNav=0;
    funds.forEach(f=>{
      const result = results[f.id];
      const row = result.annualRows.find(r=>r.year===y);
      const c = row ? row.contribution : 0;
      const i = row ? row.interest : 0;
      const w = row ? row.withdrawal : 0;
      const nav = row ? row.navEnd : result.finalNav;
      const m = row && row.phase!=="Rút" ? result.monthlyRequired : 0;
      rowOut[f.name+" - Góp (đ)"] = Math.round(c);
      rowOut[f.name+" - Lãi (đ)"] = Math.round(i);
      rowOut[f.name+" - Rút (đ)"] = Math.round(w);
      totC+=c; totI+=i; totW+=w; totM+=m; totNav+=nav;
    });
    rowOut["TỔNG - Góp (đ)"] = Math.round(totC);
    rowOut["TỔNG - Lãi (đ)"] = Math.round(totI);
    rowOut["TỔNG - Rút (đ)"] = Math.round(totW);
    rowOut["TỔNG - Góp/tháng (đ)"] = Math.round(totM);
    rowOut["TỔNG - Số dư cuối năm (đ)"] = Math.round(totNav);
    yearlyRows.push(rowOut);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(yearlyRows), "Tổng hợp theo năm");

  funds.forEach(f=>{
    const rows = results[f.id].annualRows.map(r=>({
      "Năm": r.calYear,
      "Giai đoạn": r.phase,
      "Góp vào (đ)": Math.round(r.contribution),
      "Rút ra (đ)": Math.round(r.withdrawal),
      "Lãi trong năm (đ)": Math.round(r.interest),
      "Số dư cuối năm (đ)": Math.round(r.navEnd),
    }));
    let safeName = f.name.replace(/[:\\/?*\[\]]/g,"").slice(0,31) || "Quỹ";
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), safeName);
  });

  XLSX.writeFile(wb, "ke-hoach-quy-gia-dinh.xlsx");
}

function App(){
  const [funds, setFunds] = useState(loadFunds);
  const [tab, setTab] = useState("overview");
  const [detailFundId, setDetailFundId] = useState(()=>loadFunds()[0].id);
  const [monthlyCap, setMonthlyCap] = useState(loadCap);
  const [syncOpen, setSyncOpen] = useState(false);
  const [codeText, setCodeText] = useState("");
  const [copyStatus, setCopyStatus] = useState("");
  const [importText, setImportText] = useState("");

  useEffect(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(funds)); }catch(e){}
  },[funds]);

  useEffect(()=>{
    try{ localStorage.setItem(CAP_STORAGE_KEY, JSON.stringify(monthlyCap)); }catch(e){}
  },[monthlyCap]);

  const results = useMemo(()=>{
    const map={};
    funds.forEach(f=>{ map[f.id]=computeFund(f); });
    return map;
  },[funds]);

  const totals = useMemo(()=>{
    let monthly=0, lump=0;
    funds.forEach(f=>{ monthly+=results[f.id].monthlyRequired; lump+=Number(f.lumpSum)||0; });
    return {monthly,lump};
  },[funds,results]);

  // ---- Phân tích ngân sách: nếu đặt giới hạn góp/tháng, tìm năm nào vượt và gợi ý quỹ nào nên
  // giữ ưu tiên (cần rút sớm) hay nên giảm/dời (chưa gấp). Quỹ "vừa góp vừa rút song song" cần
  // tiền ngay từ bây giờ nên luôn ưu tiên cao nhất; quỹ "tích lũy trước" ưu tiên theo năm bắt đầu rút/đạt mục tiêu.
  const budgetAnalysis = useMemo(()=>{
    if(!monthlyCap || monthlyCap<=0) return null;
    const maxYears = Math.max(1, ...funds.map(f=>results[f.id].totalYears));
    const urgencyOf = (f)=> f.type==="simultaneous" ? CURRENT_YEAR : (CURRENT_YEAR + (Number(f.accYears)||0));
    const priorityOrder = [...funds].sort((a,b)=>urgencyOf(a)-urgencyOf(b));

    const yearIssues=[];
    for(let y=1;y<=maxYears;y++){
      const calYear = CURRENT_YEAR+y-1;
      const active = priorityOrder.map(f=>{
        const result = results[f.id];
        const row = result.annualRows.find(r=>r.year===y);
        const monthly = row && row.phase!=="Rút" ? result.monthlyRequired : 0;
        return {fund:f, monthly};
      }).filter(x=>x.monthly>0);
      const total = active.reduce((s,x)=>s+x.monthly,0);
      if(total>monthlyCap+1){
        let running=0; const keep=[]; const cut=[];
        active.forEach(x=>{
          if(running+x.monthly<=monthlyCap){ running+=x.monthly; keep.push(x); }
          else{ cut.push(x); }
        });
        yearIssues.push({calYear,y,total,over:total-monthlyCap,keep,cut});
      }
    }
    return {priorityOrder, yearIssues};
  },[funds,results,monthlyCap]);

  const updateFund=(id,next)=>setFunds(fs=>fs.map(f=>f.id===id?next:f));
  const removeFund=(id)=>setFunds(fs=>fs.filter(f=>f.id!==id));
  const addFund=()=>{
    const id="f"+(idCounter++);
    const nf={id,name:"Quỹ mới",type:"sequential",rate:10,accYears:5,lumpSum:0,goalMode:"direct",targetAmountInput:500000000,withdrawAmount:0,withdrawYears:0};
    setFunds(fs=>[...fs,nf]);
    setDetailFundId(id);
  };
  const resetDefaults=()=>{
    if(!confirm("Xóa dữ liệu đã lưu và quay về 4 quỹ mẫu ban đầu?")) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    setFunds(seedFunds);
    setDetailFundId(seedFunds[0].id);
  };

  const exportCode = ()=>{
    try{
      const payload = JSON.stringify({v:1, funds, monthlyCap});
      const code = btoa(unescape(encodeURIComponent(payload)));
      setCodeText(code);
      setSyncOpen(true);
      setCopyStatus("");
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code)
          .then(()=>setCopyStatus("✓ Đã tự động sao chép vào bộ nhớ tạm — dán (Ctrl+V) sang thiết bị kia."))
          .catch(()=>setCopyStatus("Đã tạo mã bên dưới — bấm vào ô rồi tự sao chép (Ctrl+A, Ctrl+C)."));
      }else{
        setCopyStatus("Đã tạo mã bên dưới — bấm vào ô rồi tự sao chép (Ctrl+A, Ctrl+C).");
      }
    }catch(e){
      alert("Không thể tạo mã, vui lòng thử lại.");
    }
  };

  const importCode = ()=>{
    const text = importText.trim();
    if(!text){ alert("Vui lòng dán mã vào ô trước."); return; }
    try{
      const json = decodeURIComponent(escape(atob(text)));
      const obj = JSON.parse(json);
      if(!obj || !Array.isArray(obj.funds) || !obj.funds.length) throw new Error("invalid");
      if(!confirm("Thao tác này sẽ THAY THẾ toàn bộ dữ liệu quỹ hiện tại trên thiết bị này bằng dữ liệu trong mã vừa dán. Tiếp tục?")) return;
      setFunds(obj.funds.map(f=>({type:"sequential",...f})));
      if(typeof obj.monthlyCap==="number") setMonthlyCap(obj.monthlyCap);
      setDetailFundId(obj.funds[0].id);
      setImportText("");
      alert("Đã nhập dữ liệu thành công!");
    }catch(e){
      alert("Mã không hợp lệ hoặc bị lỗi — vui lòng kiểm tra đã dán đầy đủ, không thiếu ký tự.");
    }
  };

  const detailFund = funds.find(f=>f.id===detailFundId) || funds[0];
  const detailResult = detailFund ? results[detailFund.id] : null;
  const detailMilestones = useMemo(()=> detailResult ? computeDoublingMilestones(detailResult.annualRows, r=>r.navEnd, r=>r.year) : {}, [detailResult]);
  const detailCumulative = useMemo(()=>{
    if(!detailResult) return {};
    let running=0; const map={};
    detailResult.annualRows.forEach(r=>{ running+=r.contribution; map[r.year]=running; });
    return map;
  },[detailResult]);

  return (
    <div>
      <div className="header">
        <div className="header-inner">
          <div className="eyebrow"><span>Sổ Kế Hoạch Tài Chính</span><span className="dim">· cập nhật {CURRENT_YEAR}</span></div>
          <h1 className="serif">Các Quỹ Mục Tiêu Gia Đình</h1>
          <p className="subtitle">Quỹ "tích lũy trước, rút sau" dùng cho mục tiêu có mốc rõ ràng (con vào đại học). Quỹ "vừa góp vừa rút song song" dùng cho nhu cầu chi tiêu đều đặn ngay từ bây giờ (phụng dưỡng bố mẹ, du lịch hàng năm).</p>
          <div className="toolbar">
            <button className="btn primary" onClick={()=>exportExcel(funds,results)}>⬇ Xuất Excel</button>
            <button className="btn" onClick={()=>setSyncOpen(s=>!s)}>🔗 Đồng bộ sang thiết bị khác</button>
            <button className="btn ghost" onClick={resetDefaults}>Đặt lại mặc định</button>
            <span className="save-note">Dữ liệu tự lưu trên trình duyệt này — quay lại không cần nhập lại.</span>
          </div>

          {syncOpen && (
            <div className="sync-panel">
              <div style={{fontSize:13,fontWeight:600,marginBottom:4}}>1. Lấy mã từ thiết bị này</div>
              <div style={{fontSize:12,color:"var(--mute)"}}>Bấm nút để tạo mã chứa toàn bộ dữ liệu các quỹ, rồi gửi/dán mã đó sang thiết bị khác.</div>
              <div className="sync-row">
                <button className="btn primary" onClick={exportCode}>Tạo mã dữ liệu</button>
                {copyStatus && <span style={{fontSize:12,color:"var(--teal)"}}>{copyStatus}</span>}
              </div>
              {codeText && (
                <textarea className="sync-textarea" readOnly value={codeText} onFocus={(e)=>e.target.select()} />
              )}

              <div style={{fontSize:13,fontWeight:600,margin:"18px 0 4px"}}>2. Dán mã vào thiết bị khác để nhập lại</div>
              <div style={{fontSize:12,color:"var(--mute)"}}>Mở trang này trên thiết bị kia, dán mã đã sao chép ở bước 1 vào ô dưới rồi bấm nhập.</div>
              <textarea className="sync-textarea" placeholder="Dán mã đã sao chép ở thiết bị cũ vào đây..." value={importText} onChange={(e)=>setImportText(e.target.value)} />
              <div className="sync-row">
                <button className="btn primary" onClick={importCode}>Nhập mã này (ghi đè dữ liệu hiện tại)</button>
              </div>
              <div style={{fontSize:11,color:"var(--mute)",marginTop:8}}>Mã chứa toàn bộ thông tin các quỹ và giới hạn góp/tháng — dán đúng nguyên mã, không chỉnh sửa, để tránh lỗi khi nhập lại.</div>
            </div>
          )}
        </div>
      </div>

      <div className="container">
        <div className="dashboard">
          <div className="card"><div className="card-label">Tổng cần góp mỗi tháng (mọi quỹ)</div><div className="card-value mono" style={{color:"var(--gold)"}}>{fmt(totals.monthly)}</div></div>
          <div className="card"><div className="card-label">Tổng bỏ sẵn 1 lần</div><div className="card-value mono" style={{color:"var(--teal)"}}>{fmt(totals.lump)}</div></div>
          <div className="card"><div className="card-label">Số quỹ đang quản lý</div><div className="card-value mono">{funds.length}</div></div>
        </div>

        <div className="budget-panel">
          <div className="budget-row">
            <div style={{fontSize:13,fontWeight:600}}>Giới hạn góp mỗi tháng (tuỳ chọn)</div>
            <div className="budget-input"><MoneyInput value={monthlyCap} onChange={setMonthlyCap} suffix="đ/tháng" /></div>
            <span style={{fontSize:11,color:"var(--mute)"}}>Đặt 0 để tắt cảnh báo. Ví dụ: chỉ đóng tối đa 50.000.000đ/tháng cho tất cả các quỹ.</span>
          </div>

          {budgetAnalysis && budgetAnalysis.yearIssues.length===0 && (
            <div className="info-box" style={{marginTop:12}}>✓ Với giới hạn {fmtShort(monthlyCap)}/tháng, tất cả các năm đều đủ ngân sách — không cần cắt giảm quỹ nào.</div>
          )}

          {budgetAnalysis && budgetAnalysis.yearIssues.length>0 && (
            <div style={{marginTop:12}}>
              <div className="warn-box">
                ⚠ Có {budgetAnalysis.yearIssues.length} năm tổng góp/tháng vượt giới hạn {fmtShort(monthlyCap)}/tháng — năm vượt nhiều nhất phải góp thêm khoảng {fmtShort(Math.max(...budgetAnalysis.yearIssues.map(i=>i.over)))}/tháng so với giới hạn.
              </div>
              <div className="table-wrap">
                <table>
                  <thead><tr>
                    <th>Năm</th><th className="r">Tổng cần góp/tháng</th><th className="r">Vượt</th><th>Quỹ nên giữ ưu tiên</th><th>Quỹ nên cân nhắc giảm / dời</th>
                  </tr></thead>
                  <tbody>
                    {budgetAnalysis.yearIssues.map(iss=>(
                      <tr key={iss.calYear}>
                        <td className="mono">{iss.calYear}</td>
                        <td className="r mono" style={{color:"var(--rust)"}}>{fmt(iss.total)}</td>
                        <td className="r mono" style={{color:"var(--rust)",fontWeight:700}}>+{fmt(iss.over)}</td>
                        <td style={{fontSize:12,color:"var(--teal)"}}>{iss.keep.length? iss.keep.map(x=>x.fund.name).join(", ") : "—"}</td>
                        <td style={{fontSize:12,color:"var(--rust)"}}>{iss.cut.map(x=>x.fund.name).join(", ")}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{fontSize:12,color:"var(--mute)",marginTop:10,lineHeight:1.6}}>
                <b>Thứ tự ưu tiên</b> (quỹ cần rút/đạt mục tiêu sớm nhất được giữ nguyên góp trước): {budgetAnalysis.priorityOrder.map(f=>f.name).join(" → ")}.
                Với các quỹ "nên cân nhắc giảm/dời", bạn có thể: giảm số tiền mục tiêu, kéo dài thêm số năm tích lũy, hoặc lùi thời điểm bắt đầu rút — vào tab "Thiết lập từng quỹ" để chỉnh.
              </div>
            </div>
          )}
        </div>

        <div className="tabs">
          <button className={"tab"+(tab==="overview"?" active":"")} onClick={()=>setTab("overview")}>Tổng quan & Biểu đồ</button>
          <button className={"tab"+(tab==="funds"?" active":"")} onClick={()=>setTab("funds")}>Thiết lập từng quỹ</button>
          <button className={"tab"+(tab==="summary"?" active":"")} onClick={()=>setTab("summary")}>Tổng hợp theo năm</button>
          <button className={"tab"+(tab==="details"?" active":"")} onClick={()=>setTab("details")}>Bảng chi tiết 1 quỹ</button>
        </div>

        {tab==="overview" && (
          <div>
            <CashFlowChart funds={funds} results={results} />
            <ChartPanel funds={funds} results={results} />
          </div>
        )}

        {tab==="summary" && <YearlySummaryTable funds={funds} results={results} />}

        {tab==="funds" && (
          <div>
            <div className="fund-grid">
              {funds.map((f,i)=>(
                <FundCard key={f.id} fund={f} index={i} result={results[f.id]}
                  onChange={(next)=>updateFund(f.id,next)} onRemove={()=>removeFund(f.id)} />
              ))}
            </div>
            <button className="btn primary btn-add" onClick={addFund}>+ Thêm quỹ mới</button>
          </div>
        )}

        {tab==="details" && detailFund && (
          <div>
            <div className="pill-row">
              {funds.map((f,i)=>(
                <button key={f.id} className={"pill"+(detailFundId===f.id?" active":"")} onClick={()=>setDetailFundId(f.id)}>
                  <span className="dot" style={{background:FUND_COLORS[i%FUND_COLORS.length],width:8,height:8}}></span>{f.name}
                </button>
              ))}
            </div>
            <div className="panel">
              {Object.keys(detailMilestones).length>0 && (
                <div className="chart-note" style={{paddingBottom:12}}>
                  <span className="milestone-legend"><span className="milestone-swatch"></span>Ô tô xanh = số dư cuối năm đã nhân đôi so với mốc trước đó (so với năm đầu tiên)</span>
                </div>
              )}
              <table>
                <thead><tr>
                  <th>Năm</th><th>Giai đoạn</th><th className="r">Góp vào</th><th className="r">Góp lũy kế</th><th className="r">Rút ra</th><th className="r">Lãi trong năm</th><th className="r">Số dư cuối năm</th>
                </tr></thead>
                <tbody>
                  {detailResult.annualRows.map(r=>(
                    <tr key={r.year}>
                      <td className="mono">{r.calYear} <span style={{color:"var(--mute)"}}>(N{r.year})</span></td>
                      <td><span className={"badge "+(r.phase==="Tích lũy"?"acc":r.phase==="Rút"?"wd":"both")}>{r.phase}</span></td>
                      <td className="r mono" style={{color: r.contribution?"var(--teal)":"var(--mute)"}}>{r.contribution?fmt(r.contribution):"—"}</td>
                      <td className="r mono" style={{color:"var(--gold)"}}>{fmt(detailCumulative[r.year])}</td>
                      <td className="r mono" style={{color: r.withdrawal?"var(--rust)":"var(--mute)"}}>{r.withdrawal?"-"+fmt(r.withdrawal):"—"}</td>
                      <td className="r mono" style={{color:"var(--mute)"}}>{fmt(r.interest)}</td>
                      <td className={"r mono"+(detailMilestones[r.year]?" cell-x2":"")} data-mult={detailMilestones[r.year]||undefined} style={{fontWeight:700, color: detailMilestones[r.year] ? undefined : (r.navEnd<0 ? "var(--rust)" : "var(--ink)")}}>{fmt(r.navEnd)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        <div className="footnote">
          <b>Cách tính:</b> lãi suất năm quy đổi sang lãi suất tháng r = (1+r_năm)^(1/12) − 1, áp dụng công thức giá trị
          tương lai của chuỗi góp đều hàng tháng để giải ra số tiền cần góp — khoản góp tháng 1 sinh lời đủ 12 tháng
          trong năm, khoản góp tháng 11 chỉ sinh lời 1-2 tháng, đúng thực tế thay vì gộp chung một mức lãi cho cả năm.
          Với quỹ "vừa góp vừa rút song song", việc rút được tính vào <i>cuối mỗi năm</i> (sau khi tiền góp trong năm đó
          đã kịp sinh lời), và số tiền góp/tháng được giải sao cho quỹ vừa đủ về 0 đúng vào năm cuối cùng bạn khai rút.
          Lãi suất là mức <i>kỳ vọng</i> bạn tự đặt — đây là kịch bản ước tính để lên kế hoạch, không phải cam kết lợi nhuận.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
