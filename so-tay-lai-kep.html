<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
* { box-sizing: border-box; }
:root {
  --paper: #F3ECD9; --paper-card: #FFFDF7; --ink: #1B3A2B; --ink-soft: #4C6357;
  --gold: #B8862E; --seal: #9C3B3B; --teal: #2F7A6B; --line: rgba(27,58,43,0.18);
}
body {
  margin: 0; background: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, rgba(27,58,43,0.06) 28px);
  min-height: 100vh; font-family: 'Inter', sans-serif; color: var(--ink); padding-bottom: 40px;
}
.ledger-cover { padding: 28px 20px 20px; text-align: center; border-bottom: 3px double var(--ink);
  background: linear-gradient(180deg, rgba(184,134,46,0.08), transparent); }
.ledger-cover h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: 26px; letter-spacing: 0.5px; margin: 0; }
.ledger-cover p { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft); margin: 6px 0 0; }
.ledger-page { max-width: 480px; margin: 18px auto 0; padding: 0 16px; }
.ledger-card { background: var(--paper-card); border: 1px solid var(--line); border-radius: 4px;
  padding: 16px 16px 18px; margin-bottom: 16px; box-shadow: 0 1px 0 rgba(27,58,43,0.05); }
.ledger-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1.5px;
  color: var(--gold); text-transform: uppercase; margin-bottom: 2px; display: block; }
.ledger-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; display: flex;
  align-items: center; gap: 8px; margin: 0 0 14px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.ledger-label { font-size: 12px; color: var(--ink-soft); display: block; margin-bottom: 4px; font-weight: 500; }
.ledger-input-wrap { display: flex; align-items: center; border-bottom: 1.5px solid var(--ink); padding-bottom: 3px; }
.ledger-input { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; color: var(--ink);
  background: transparent; border: none; outline: none; width: 100%; -webkit-appearance: none; }

<body>
<div class="ledger-cover">
  <h1>Sổ Tay Lãi Kép</h1>
  <p>Kế hoạch tích lũy &amp; về hưu</p>
  <div class="save-banner">
    ✓ Dữ liệu tự lưu trên máy này &mdash; mở lại không cần nhập lại
    <span class="link" data-action="reset">Xoá &amp; về mặc định</span>
  </div>
</div>
<div class="ledger-page" id="app"></div>

<script>
// ================= Helpers =================
const fmtVND = (n) => new Intl.NumberFormat('vi-VN').format(Math.round(n || 0));
const parseDigits = (s) => Number(String(s).replace(/[^\d]/g, '')) || 0;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function fvAnnuity(monthly, annualRatePct, months) {
  const r = annualRatePct / 100 / 12;
  if (months <= 0) return 0;
  if (Math.abs(r) < 1e-9) return monthly * months;
  return monthly * ((Math.pow(1 + r, months) - 1) / r);
}
function fvLumpSum(principal, annualRatePct, months) {
  const r = annualRatePct / 100 / 12;
  return principal * Math.pow(1 + r, months);
}
function ruleOf72(ratePct) { return ratePct > 0 ? 72 / ratePct : Infinity; }

const SCENARIO_DEFS = [
  { key: 'conservative', label: 'Thận trọng', rate: 6, color: '#5B6B8C' },
  { key: 'balanced', label: 'Cân bằng', rate: 9, color: '#2F7A6B' },
  { key: 'growth', label: 'Tăng trưởng', rate: 12, color: '#B8862E' },
  { key: 'aggressive', label: 'Mạo hiểm', rate: 15, color: '#9C3B3B' },
];
const RISK_RULES = {
  safe: { offset: 100, label: 'An toàn', color: '#2F7A6B' },
  standard: { offset: 110, label: 'Tiêu chuẩn', color: '#B8862E' },
  aggressive: { offset: 120, label: 'Tối đa', color: '#9C3B3B' },
};
const PIE_COLORS = ['#B8862E', '#2F7A6B', '#9C3B3B', '#5B6B8C', '#7A5C3E', '#3F7D8C', '#8C6B3F'];

const DEFAULT_CHANNELS = [
  { id: 1, name: 'Chứng khoán', rate: 12, risky: true, mode: 'dca', lumpSum: 0, monthly: 5000000 },
  { id: 2, name: 'Bất động sản', rate: 10, risky: true, mode: 'lump', lumpSum: 1000000000, monthly: 0 },
  { id: 3, name: 'Vàng', rate: 7, risky: false, mode: 'dca', lumpSum: 0, monthly: 2000000 },
  { id: 4, name: 'Bạc', rate: 6, risky: false, mode: 'dca', lumpSum: 0, monthly: 1000000 },
  { id: 5, name: 'Tiết kiệm / Coin', rate: 5, risky: false, mode: 'both', lumpSum: 200000000, monthly: 2000000 },
];
const DEFAULT_SCENARIOS = { conservative: false, balanced: true, growth: true, aggressive: false };
const DEFAULT_STATE = {
  currentAge: 30, retireAge: 55, desiredRate: 10, monthlyExpense: 20000000,
  doublingPeriodOverride: null, channels: DEFAULT_CHANNELS, scenarios: DEFAULT_SCENARIOS, riskRule: 'standard',
};

// ================= Persistence (localStorage) =================
const STORAGE_KEY = 'lai-kep-state-v1';
let idCounter = 100;
let state;
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  state = raw ? Object.assign({}, DEFAULT_STATE, JSON.parse(raw)) : JSON.parse(JSON.stringify(DEFAULT_STATE));
} catch (e) {
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
}
if (state.channels && state.channels.length) {
  idCounter = Math.max(...state.channels.map((c) => c.id)) + 1;
}
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

// ================= Derived calculations =================
function computeDerived(s) {
  const years = Math.max(0, s.retireAge - s.currentAge);
  const months = years * 12;
  const withWeight = s.channels.map((c) => ({ ...c, weight: c.lumpSum + c.monthly * months }));
  const totalWeight = withWeight.reduce((a, c) => a + c.weight, 0);
  const riskyWeight = withWeight.filter((c) => c.risky).reduce((a, c) => a + c.weight, 0);
  const safeWeight = totalWeight - riskyWeight;
  const riskyPct = totalWeight > 0 ? (riskyWeight / totalWeight) * 100 : 0;
  const blendedRate = totalWeight > 0 ? withWeight.reduce((a, c) => a + c.rate * c.weight, 0) / totalWeight : 0;
  const rRisky = riskyWeight > 0 ? withWeight.filter((c) => c.risky).reduce((a, c) => a + c.rate * c.weight, 0) / riskyWeight : 0;
  const rSafe = safeWeight > 0 ? withWeight.filter((c) => !c.risky).reduce((a, c) => a + c.rate * c.weight, 0) / safeWeight : 0;

  const maxRiskyByRule = {
    safe: clamp(RISK_RULES.safe.offset - s.currentAge, 0, 100),
    standard: clamp(RISK_RULES.standard.offset - s.currentAge, 0, 100),
    aggressive: clamp(RISK_RULES.aggressive.offset - s.currentAge, 0, 100),
  };
  const maxRisky = maxRiskyByRule[s.riskRule];
  const isOverRisk = riskyPct > maxRisky + 0.01;

  const totalLumpSum = s.channels.reduce((a, c) => a + c.lumpSum, 0);
  const totalMonthly = s.channels.reduce((a, c) => a + c.monthly, 0);

  const channelFV = s.channels.map((c) => ({
    ...c, fv: fvLumpSum(c.lumpSum, c.rate, months) + fvAnnuity(c.monthly, c.rate, months),
  }));
  const fvPortfolio = channelFV.reduce((a, c) => a + c.fv, 0);
  const fvTarget = fvLumpSum(totalLumpSum, s.desiredRate, months) + fvAnnuity(totalMonthly, s.desiredRate, months);
  const neededCorpus = s.monthlyExpense * 12 * 25;

  const doubleTarget = ruleOf72(s.desiredRate);
  const autoDoublingPeriod = blendedRate > 0 ? ruleOf72(blendedRate) : null;
  const doublingPeriod = (s.doublingPeriodOverride !== null && s.doublingPeriodOverride !== undefined)
    ? s.doublingPeriodOverride : (autoDoublingPeriod || 5);
  const numDoublings = doublingPeriod > 0 ? years / doublingPeriod : 0;
  const multiplier = Math.pow(2, numDoublings);
  const illustrationBase = totalLumpSum > 0 ? totalLumpSum : 1000000000;
  const projectedByRule72 = illustrationBase * multiplier;
  const projectedExactCompound = fvLumpSum(illustrationBase, blendedRate, months);

  const activeScenarios = SCENARIO_DEFS.filter((sc) => s.scenarios[sc.key]);
  const chartData = [];
  for (let y = 0; y <= years; y++) {
    const m = y * 12;
    const portfolioVal = s.channels.reduce((a, c) => a + fvLumpSum(c.lumpSum, c.rate, m) + fvAnnuity(c.monthly, c.rate, m), 0);
    const row = {
      age: s.currentAge + y,
      portfolio: portfolioVal,
      target: fvLumpSum(totalLumpSum, s.desiredRate, m) + fvAnnuity(totalMonthly, s.desiredRate, m),
      scenarios: {},
    };
    activeScenarios.forEach((sc) => {
      row.scenarios[sc.key] = fvLumpSum(totalLumpSum, sc.rate, m) + fvAnnuity(totalMonthly, sc.rate, m);
    });
    chartData.push(row);
  }
  let maxVal = 0;
  chartData.forEach((r) => {
    maxVal = Math.max(maxVal, r.portfolio, r.target, ...Object.values(r.scenarios));
  });
  const unit = maxVal >= 1e9 ? { div: 1e9, label: 'tỷ đ' } : { div: 1e6, label: 'triệu đ' };
  const scaled = (v) => (v / unit.div).toFixed(1);

  const pieData = channelFV.filter((c) => c.fv > 0).map((c) => ({ name: c.name, value: c.fv, risky: c.risky }));

  const yearlyTable = [];
  for (let y = 0; y <= years; y++) {
    const m = y * 12;
    const values = s.channels.map((c) => fvLumpSum(c.lumpSum, c.rate, m) + fvAnnuity(c.monthly, c.rate, m));
    const total = values.reduce((a, v) => a + v, 0);
    yearlyTable.push({ age: s.currentAge + y, values, total });
  }

  let suggestion = { type: 'empty' };
  if (totalWeight > 0) {
    if (rRisky === rSafe) suggestion = { type: 'flat' };
    else if (s.desiredRate <= rSafe) suggestion = { type: 'safe-enough' };
    else if (s.desiredRate > rRisky) suggestion = { type: 'impossible', rRisky };
    else {
      const neededRiskyWeightPct = clamp(((s.desiredRate - rSafe) / (rRisky - rSafe)) * 100, 0, 100);
      const fx = riskyWeight / totalWeight;
      const rRiskyNeeded = fx > 0 ? (s.desiredRate - (1 - fx) * rSafe) / fx : null;
      suggestion = { type: 'ok', neededRiskyWeightPct, rRiskyNeeded, overLimit: ((s.desiredRate - rSafe) / (rRisky - rSafe)) * 100 > maxRisky };
    }
  }

  return {
    years, months, blendedRate, riskyPct, maxRiskyByRule, maxRisky, isOverRisk, rRisky, rSafe, totalWeight,
    fvPortfolio, fvTarget, neededCorpus, doubleTarget, autoDoublingPeriod, doublingPeriod, numDoublings, multiplier,
    illustrationBase, projectedByRule72, projectedExactCompound, activeScenarios, chartData, unit, scaled, pieData,
    yearlyTable, suggestion, channelFV,
  };
}

// ================= SVG chart =================
function buildLineChartSVG(d) {
  const W = 320, H = 220, padL = 34, padR = 8, padT = 10, padB = 22;
  const data = d.chartData;
  if (!data.length) return '';
  const minAge = data[0].age, maxAge = data[data.length - 1].age;
  const xScale = (age) => padL + (maxAge > minAge ? (age - minAge) / (maxAge - minAge) : 0) * (W - padL - padR);
  let maxV = 0;
  data.forEach((r) => { maxV = Math.max(maxV, r.portfolio, r.target, ...Object.values(r.scenarios)); });
  if (maxV <= 0) maxV = 1;
  const yScale = (v) => H - padB - (v / maxV) * (H - padT - padB);

  const toPath = (key, isNested) => data.map((r) => {
    const v = isNested ? r.scenarios[key] : r[key];
    return xScale(r.age).toFixed(1) + ',' + yScale(v).toFixed(1);
  }).join(' ');

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;font-family:IBM Plex Mono,monospace;">';
  // gridlines
  for (let i = 0; i <= 4; i++) {
    const y = padT + (i * (H - padT - padB)) / 4;
    svg += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="rgba(27,58,43,0.15)" stroke-dasharray="3 3"/>';
    const val = maxV * (1 - i / 4);
    svg += '<text x="' + (padL - 4) + '" y="' + (y + 3).toFixed(1) + '" font-size="8" fill="#4C6357" text-anchor="end">' + d.scaled(val) + '</text>';
  }
  // x labels (first, mid, last)
  [data[0], data[Math.floor(data.length / 2)], data[data.length - 1]].forEach((r) => {
    svg += '<text x="' + xScale(r.age).toFixed(1) + '" y="' + (H - 6) + '" font-size="8" fill="#4C6357" text-anchor="middle">' + r.age + '</text>';
  });
  // reference line at retirement (last point)
  const lastX = xScale(maxAge);
  svg += '<line x1="' + lastX.toFixed(1) + '" y1="' + padT + '" x2="' + lastX.toFixed(1) + '" y2="' + (H - padB) + '" stroke="#9C3B3B" stroke-dasharray="4 4"/>';
  svg += '<text x="' + lastX.toFixed(1) + '" y="' + (padT + 8) + '" font-size="8" fill="#9C3B3B" text-anchor="end">Về hưu</text>';

  d.activeScenarios.forEach((sc) => {
    svg += '<polyline points="' + toPath(sc.key, true) + '" fill="none" stroke="' + sc.color + '" stroke-width="1.5" stroke-dasharray="2 3"/>';
  });
  svg += '<polyline points="' + toPath('target', false) + '" fill="none" stroke="#2F7A6B" stroke-width="2" stroke-dasharray="5 3"/>';
  svg += '<polyline points="' + toPath('portfolio', false) + '" fill="none" stroke="#B8862E" stroke-width="3"/>';
  svg += '</svg>';

  let legend = '<div class="chart-legend">';
  legend += '<span><i class="legend-dot" style="background:#B8862E"></i>Danh mục thực tế</span>';
  legend += '<span><i class="legend-dot" style="background:#2F7A6B"></i>Mục tiêu mong muốn</span>';
  d.activeScenarios.forEach((sc) => {
    legend += '<span><i class="legend-dot" style="background:' + sc.color + '"></i>' + sc.label + ' · ' + sc.rate + '%</span>';
  });
  legend += '</div>';
  return svg + legend;
}

function buildDonut(d) {
  const total = d.pieData.reduce((a, p) => a + p.value, 0);
  if (total <= 0) return { css: 'background:rgba(27,58,43,0.08)', legend: '<div class="note">Chưa có dữ liệu.</div>' };
  let acc = 0;
  const stops = d.pieData.map((p, i) => {
    const start = (acc / total) * 100;
    acc += p.value;
    const end = (acc / total) * 100;
    return PIE_COLORS[i % PIE_COLORS.length] + ' ' + start.toFixed(2) + '% ' + end.toFixed(2) + '%';
  }).join(', ');
  let legend = '';
  d.pieData.forEach((p, i) => {
    const pct = ((p.value / total) * 100).toFixed(1);
    legend += '<div class="pie-legend-row"><span><i class="legend-dot" style="background:' + PIE_COLORS[i % PIE_COLORS.length] + '"></i>' +
      esc(p.name) + (p.risky ? ' · rủi ro cao' : ' · an toàn') + '</span><span style="font-family:IBM Plex Mono,monospace;font-weight:600">' + pct + '%</span></div>';
  });
  return { css: 'background: conic-gradient(' + stops + ')', legend };
}

// ================= Render =================
function modeLabel(m) { return m === 'lump' ? 'Một lần' : m === 'dca' ? 'Định kỳ' : 'Cả hai'; }

function render() {
  const d = computeDerived(state);
  const app = document.getElementById('app');
  app.innerHTML = pageHTML(state, d);
}

function pageHTML(s, d) {
  return '' +
  // Trang 1
  '<div class="ledger-card">' +
    '<span class="ledger-eyebrow">Trang 1</span>' +
    '<h2 class="ledger-title">💰 Thông tin của bạn</h2>' +
    '<div class="grid2" style="margin-bottom:14px">' +
      fieldNumber('currentAge', 'Tuổi hiện tại', s.currentAge, 'tuổi', 16, 80, 1) +
      fieldNumber('retireAge', 'Tuổi muốn về hưu', s.retireAge, 'tuổi', s.currentAge + 1, 90, 1) +
    '</div>' +
    fieldNumber('desiredRate', 'Mức lợi tức mong muốn (mục tiêu)', s.desiredRate, '%/năm', 0, 40, 0.5) +
    '<div class="note" id="trang1Note">' + trang1NoteHTML(s, d) + '</div>' +
  '</div>' +

  // Trang 2
  '<div class="ledger-card">' +
    '<span class="ledger-eyebrow">Trang 2</span>' +
    '<h2 class="ledger-title">📈 Danh mục đầu tư</h2>' +

}

    return '<div class="risk-gauge-marker" style="left:' + d.maxRiskyByRule[key] + '%;background:' + r.color + ';opacity:' + (active ? 1 : 0.45) + ';height:' + (active ? 20 : 14) + 'px;top:' + (active ? -5 : -2) + 'px" title="' + r.label + ': ' + r.offset + '−tuổi = ' + d.maxRiskyByRule[key] + '%"></div>';
  }).join('');

    : '<div class="ok-box">✅ Danh mục đang nằm trong giới hạn rủi ro theo công thức "' + RISK_RULES[s.riskRule].label + '".</div>';

    '<div class="risk-gauge"><div class="risk-gauge-fill" style="width:' + Math.min(100, d.riskyPct) + '%"></div>' + markers + '</div>' +
    '<div class="note">🛡️ 3 mốc tham khảo ở ' + s.currentAge + ' tuổi: An toàn ' + d.maxRiskyByRule.safe + '% (100−tuổi) · Tiêu chuẩn ' + d.maxRiskyByRule.standard + '% (110−tuổi) · Tối đa ' + d.maxRiskyByRule.aggressive + '% (120−tuổi). Đang áp dụng: <b>' + RISK_RULES[s.riskRule].label + ' (' + d.maxRisky + '%)</b>. Tỷ trọng rủi ro hiện tại: ' + d.riskyPct.toFixed(1) + '%.</div>' +

  let html = '<div class="verdict" style="background:rgba(184,134,46,0.08)"><b>Cách 1 — đổi tỷ trọng:</b> tăng tỷ trọng vốn ở nhóm rủi ro cao từ <b>' + d.riskyPct.toFixed(1) + '%</b> lên khoảng <b>' + sg.neededRiskyWeightPct.toFixed(1) + '%</b> (giữ nguyên tỷ suất từng kênh) để đạt ' + s.desiredRate + '%/năm.' +
    (sg.overLimit ? ' Mức này <b>vượt giới hạn an toàn theo tuổi (' + d.maxRisky + '%)</b> — khó đạt mục tiêu chỉ bằng cách tăng rủi ro mà vẫn an toàn.' : '') + '</div>';

function updateComputed() {
  const d = computeDerived(state);
  const byId = (id) => document.getElementById(id);
  if (byId('trang1Note')) byId('trang1Note').innerHTML = trang1NoteHTML(state, d);
  state.channels.forEach((c) => {
    const el = byId('miniFv-' + c.id);
    if (el) {
      const fv = fvLumpSum(c.lumpSum, c.rate, d.months) + fvAnnuity(c.monthly, c.rate, d.months);
      el.textContent = '→ Giá trị dự kiến lúc về hưu: ' + fmtVND(fv) + ' đ';
    }
  });
  if (byId('riskSection')) byId('riskSection').innerHTML = riskSectionHTML(state, d);
  if (byId('pieSection')) byId('pieSection').innerHTML = pieSectionHTML(d);
  if (byId('tableSection')) byId('tableSection').innerHTML = tableSectionHTML(state, d);
  if (byId('neededCorpusCard')) byId('neededCorpusCard').innerHTML = neededCorpusHTML(d);
  if (byId('doublingSection')) byId('doublingSection').innerHTML = doublingSectionHTML(state, d);
  if (byId('resultsSection')) byId('resultsSection').innerHTML = resultsSectionHTML(state, d);
  if (byId('suggestionSection')) byId('suggestionSection').innerHTML = suggestionSectionHTML(state, d);
}

// ================= Save-code (backup/transfer) =================
function b64EncodeUnicode(str) {
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_, p1) => String.fromCharCode('0x' + p1)));
}
function b64DecodeUnicode(str) {
  return decodeURIComponent(atob(str).split('').map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}
async function copyCode() {
  const box = document.getElementById('codeStatus');
  try {
    const code = b64EncodeUnicode(JSON.stringify(state));
    await navigator.clipboard.writeText(code);
    box.innerHTML = '<div class="ok-box">✅ Đã sao chép mã lưu vào bộ nhớ tạm.</div>';
  } catch (e) {
    box.innerHTML = '<div class="warn-box">⚠️ Không sao chép được — hãy bấm giữ vào ô mã để copy thủ công.</div>';
  }
}
function restoreCode() {
  const box = document.getElementById('codeStatus');
  const text = document.getElementById('importBox').value;
  try {
    const d = JSON.parse(b64DecodeUnicode(text.trim()));
    state = Object.assign({}, DEFAULT_STATE, d);
    if (state.channels && state.channels.length) idCounter = Math.max(...state.channels.map((c) => c.id)) + 1;
    persist();
    render();
    document.getElementById('codeStatus').innerHTML = '<div class="ok-box">✅ Đã khôi phục số liệu từ mã lưu.</div>';
  } catch (e) {
    box.innerHTML = '<div class="warn-box">⚠️ Mã lưu không hợp lệ — kiểm tra lại đã dán đủ và đúng chưa.</div>';
  }
}

// ================= Actions =================
function addChannel() {
  idCounter += 1;
  state.channels.push({ id: idCounter, name: 'Kênh mới', rate: 8, risky: false, mode: 'dca', lumpSum: 0, monthly: 1000000 });
}
function removeChannel(id) { state.channels = state.channels.filter((c) => c.id !== id); }
function resetAll() {
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  idCounter = 100;
  persist();
  render();
}

// ================= Event delegation =================
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const cid = btn.dataset.channelId ? Number(btn.dataset.channelId) : null;
  if (action === 'addChannel') { addChannel(); persist(); render(); }
  else if (action === 'removeChannel') { removeChannel(cid); persist(); render(); }
  else if (action === 'toggleRisky') {
    const c = state.channels.find((x) => x.id === cid);
    if (c) c.risky = !c.risky;
    persist(); render();
  } else if (action === 'setMode') {
    const c = state.channels.find((x) => x.id === cid);
    if (c) {
      c.mode = btn.dataset.mode;
      if (c.mode === 'lump') c.monthly = 0;
      if (c.mode === 'dca') c.lumpSum = 0;
    }
    persist(); render();
  } else if (action === 'setRiskRule') { state.riskRule = btn.dataset.key; persist(); render(); }
  else if (action === 'toggleScenario') { state.scenarios[btn.dataset.key] = !state.scenarios[btn.dataset.key]; persist(); render(); }
  else if (action === 'copyCode') { copyCode(); }
  else if (action === 'restoreCode') { restoreCode(); }
  else if (action === 'reset') { if (confirm('Xoá toàn bộ số liệu đã lưu và về lại mặc định?')) resetAll(); }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.field) {
    if (el.dataset.type === 'vnd') {
      const v = parseDigits(el.value);
      el.value = fmtVND(v);
      state[el.dataset.field] = v;
    } else {
      const raw = el.value;
      state[el.dataset.field] = raw === '' ? null : Number(raw);
    }
    persist();
    updateComputed();
  } else if (el.dataset.cfield) {
    const c = state.channels.find((x) => String(x.id) === el.dataset.channelId);
    if (!c) return;
    if (el.dataset.cfield === 'name') {
      c.name = el.value;
    } else if (el.dataset.type === 'vnd') {
      const v = parseDigits(el.value);
      el.value = fmtVND(v);
      c[el.dataset.cfield] = v;
    } else {
      c[el.dataset.cfield] = Number(el.value);
    }
    persist();
    updateComputed();
  }
});

render();
</script>
</body>
</html>
